<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main">
            <div class="game-board">
                <div onclick="posicao('0')" class="cell" id="cell-0"></div>
                <div onclick="posicao('1')" class="cell" id="cell-1"></div>
                <div onclick="posicao('2')" class="cell" id="cell-2"></div>
                <div onclick="posicao('3')" class="cell" id="cell-3"></div>
                <div onclick="posicao('4')" class="cell" id="cell-4"></div>
                <div onclick="posicao('5')" class="cell" id="cell-5"></div>
                <div onclick="posicao('6')" class="cell" id="cell-6"></div>
                <div onclick="posicao('7')" class="cell" id="cell-7"></div>
                <div onclick="posicao('8')" class="cell" id="cell-8"></div>
                <h3 id="jogadorDaVez"> </h3>
            </div>
            <button onclick="reiniciarJogo()" class="btn-reiniciar" id="resultado">Reinicar</button>
    </main>


    <script src="/jogoDaVelha.js"></script>
</body>
</html>
